<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronohistory - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ═══ VÍDEO DE FUNDO ═══ -->
    <div class="video-bg-container">
        <video autoplay muted loop playsinline preload="auto">
            <source src="vei.mp4" type="video/mp4">
        </video>
        <div class="video-bg-overlay"></div>
    </div>

    <!-- ═══ PARTÍCULAS (geradas via JS) ═══ -->

    <!-- ═══ CARD DE LOGIN ═══ -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- Ornamento -->
            <div class="login-ornament">⚜ Acesso Chronohistory ⚜</div>

            <!-- Logo -->
            <div class="login-logo">
                <img src="logo.png" alt="Chronohistory Logo">
                <h1>Chronohistory</h1>
                <span>⚔ Desvendando o passado ⚔</span>
            </div>

            <!-- Tabs: Aluno / Professor -->
            <div class="role-tabs" id="roleTabs">
                <button class="role-tab active" data-role="aluno" id="tabAluno">
                    <span class="tab-icon">📖</span> Aluno
                </button>
                <button class="role-tab" data-role="professor" id="tabProfessor">
                    <span class="tab-icon">🏛️</span> Professor
                </button>
            </div>

            <!-- Formulário -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <span class="label-icon">✉</span> Endereço de E-mail
                    </label>
                    <input type="email" id="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">
                        <span class="label-icon">🔑</span> Senha
                    </label>
                    <input type="password" id="senha" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <a href="/esqueceu-senha" class="forgot-link">Esqueceu a senha?</a>
                    <a href="/cadastro" class="signup-link">Não tem uma conta? Cadastre-se</a>
                </div>

                <button type="submit" class="btn-login">
                    <span>⚜</span> Entrar <span>⚜</span>
                </button>
            </form>

            <!-- Rodapé -->
            <div class="login-footer">
                <span class="pixel-icon">⬥</span>
                Uma jornada através do tempo com sabedoria ancestral
                <span class="pixel-icon">⬥</span>
            </div>

        </div>
    </div>

    <!-- ═══ SCRIPTS ═══ -->
    <script>
        (function() {
            'use strict';

            // ============================================
            //  PARTÍCULAS MEDIEVAIS
            // ============================================
            const particleSymbols = ['✦', '✧', '⬥', '⬦', '◆', '◇', '⚜', '꧁', '꧂'];
            const colors = ['#C9A227', '#E8C84A', '#A68A56', '#F5E6C8', '#D4C5A9'];

            function createParticle() {
                const p = document.createElement('div');
                p.className = 'medieval-particle';
                p.textContent = particleSymbols[Math.floor(Math.random() * particleSymbols.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.bottom = '-20px';
                p.style.color = colors[Math.floor(Math.random() * colors.length)];
                const duration = 7 + Math.random() * 12;
                p.style.animationDuration = duration + 's';
                p.style.animationDelay = (Math.random() * 5) + 's';
                p.style.fontSize = (8 + Math.random() * 14) + 'px';
                document.body.appendChild(p);
                setTimeout(() => {
                    if (p.parentNode) p.parentNode.removeChild(p);
                }, (duration + 2) * 1000);
            }

            // Cria partículas periodicamente
            setInterval(createParticle, 1800);
            // Cria algumas iniciais
            for (let i = 0; i < 6; i++) {
                setTimeout(createParticle, i * 350);
            }

            // ============================================
            //  TABS: ALUNO / PROFESSOR
            // ============================================
            const tabAluno = document.getElementById('tabAluno');
            const tabProfessor = document.getElementById('tabProfessor');
            const roleTabs = document.getElementById('roleTabs');
            let currentRole = 'aluno';

            function setActiveTab(role) {
                currentRole = role;
                tabAluno.classList.toggle('active', role === 'aluno');
                tabProfessor.classList.toggle('active', role === 'professor');

                // Muda o ícone/label do botão de submit
                const btn = document.querySelector('.btn-login');
                if (role === 'aluno') {
                    btn.innerHTML = 'Entrar como Aluno';
                } else {
                    btn.innerHTML = 'Entrar como Professor';
                }
            }

            tabAluno.addEventListener('click', (e) => {
                e.preventDefault();
                setActiveTab('aluno');
            });

            tabProfessor.addEventListener('click', (e) => {
                e.preventDefault();
                setActiveTab('professor');
            });

            // ============================================
            //  SUBMISSÃO DO FORMULÁRIO
            // ============================================
            const form = document.getElementById('loginForm');

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const senha = document.getElementById('senha').value.trim();

                if (!email || !senha) {
                    alert('Por favor, preencha todos os campos.');
                    return;
                }

                // Simulação de login com feedback estilizado
                const btn = form.querySelector('.btn-login');
                const originalText = btn.innerHTML;
                btn.innerHTML = '⏳ Autenticando...';
                btn.disabled = true;
                btn.style.opacity = '0.7';

                // Simula requisição
                setTimeout(() => {
                    btn.innerHTML = '✅ Sucesso!';
                    btn.style.background = 'linear-gradient(135deg, #2d7d46, #3a9d5a)';

                    // Mensagem com o papel selecionado
                    const roleLabel = currentRole === 'aluno' ? 'Aluno' : 'Professor';
                    alert(`🎉 Bem-vindo, ${roleLabel}!\n\nE-mail: ${email}\nAcesso concedido à Chronohistory.`);

                    // Reseta botão
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    if (currentRole === 'aluno') {
                        btn.innerHTML = '<span>📖</span> Entrar como Aluno <span>📖</span>';
                    } else {
                        btn.innerHTML = '<span>🏛️</span> Entrar como Professor <span>🏛️</span>';
                    }
                    btn.style.background = 'linear-gradient(135deg, #8b6914, #a68a56)';

                    // Limpa campos (opcional)
                    // document.getElementById('email').value = '';
                    // document.getElementById('senha').value = '';
                }, 1500);
            });

            // ============================================
            //  KEYBOARD SHORTCUT: Enter submete
            // ============================================
            document.getElementById('senha').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // ============================================
            //  INICIALIZA: seta tab ativa
            // ============================================
            setActiveTab('aluno');

        })();
    </script>
</body>
</html>
