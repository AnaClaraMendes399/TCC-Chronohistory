<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronohistory — Cadastro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="cadastro.css" />
</head>
<body>

    <!-- VÍDEO DE FUNDO -->
    <div class="video-bg-container">
        <video autoplay muted loop playsinline preload="auto">
            <source src="vei.mp4" type="video/mp4" />
        </video>
        <div class="video-bg-overlay"></div>
    </div>

    <!-- CARD DE CADASTRO -->
    <div class="login-wrapper">
        <div class="login-card">

            <!-- FORMULÁRIO -->
            <section class="panel-form">

                <div class="brand">
                    <span class="brand-mark">C</span>
                    <span class="brand-name">Chronohistory</span>
                </div>

                <h1 class="login-title">Criar conta</h1>
                <p class="login-subtitle">Comece sua jornada pela história agora.</p>

                <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>

                <form class="login-form" id="registerForm" novalidate>

                    <div class="form-group">
                        <label for="fullname">Nome completo</label>
                        <input type="text" id="fullname" name="fullname" placeholder="Digite seu nome completo" autocomplete="name" />
                    </div>

                    <div class="form-group">
                        <label for="username">Usuário</label>
                        <input type="text" id="username" name="username" placeholder="Escolha um usuário" autocomplete="username" />
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" name="password" placeholder="Crie uma senha" autocomplete="new-password" />
                    </div>

                    <div class="form-row">
                        <label class="checkbox">
                            <input type="checkbox" id="terms" name="terms" />
                            <span class="checkbox-box" aria-hidden="true"></span>
                            <span class="checkbox-label">Aceito os <a href="#" class="link-forgot">Termos de Uso</a></span>
                        </label>
                    </div>

                    <button type="submit" class="btn-submit">Criar conta</button>

                </form>

                <p class="login-footer">Já tem uma conta? <a href="login.html" style="color: var(--brown-hover); text-decoration: none;">Faça login</a></p>
            </section>

        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        (function() {
            'use strict';

            const form = document.getElementById('registerForm');

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const fullname = document.getElementById('fullname').value.trim();
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();
                const terms = document.getElementById('terms').checked;

                if (!fullname || !username || !password) {
                    alert('Preencha todos os campos para continuar.');
                    return;
                }

                if (!terms) {
                    alert('Você deve aceitar os Termos de Uso para criar uma conta.');
                    return;
                }

                alert('Conta criada com sucesso, ' + fullname + '!\nBem-vindo(a) ao Chronohistory.');
            });

        })();
    </script>
</body>
</html>
